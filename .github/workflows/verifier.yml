# Determinism and verifier-artifact CI.
#
# The claim this repo makes to arbitrators is that a laytime figure is
# reproducible from its inputs alone. That claim is only as good as the checks
# that enforce it, so all three run on every change:
#
#   1. both 500-case corpora still replay,
#   2. the pinned timezone table still agrees with the runtime's ICU,
#   3. the readable .mjs and the sealed .wasm compute an IDENTICAL root — for
#      EVERY engine rule set, not just the current one.
#
# (3) is the one that cannot be faked by a passing unit test: it executes both
# artifacts, in two different engines, over the same 1,000 cases.
#
# The engine carries two rule sets. v1 is frozen and its root, bc9f24fdab910a1b,
# is published; the build fails outright if it moves, because a moved root means
# every claim already served under those rules would no longer verify.

name: verifier

on:
  push:
    branches: ["**"]
  pull_request:

env:
  JAVY_VERSION: "9.0.0"
  WASMTIME_VERSION: "37.0.1"

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Node is required as well, and deliberately: the wasm is executed under
      # node:wasi while the JS artifact runs under Node's own JS engine, so the
      # equivalence check spans two independent runtimes rather than one.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: bun install --frozen-lockfile

      - name: Engine + verifier unit tests
        run: bun test packages/

      - name: 500-case corpus replay (both rule sets)
        run: bun test src/lib/laytime/regression.test.ts

      # Regenerating v1 must reproduce the committed goldens byte for byte. The
      # replay above proves the ENGINE still agrees with them; this proves the
      # GENERATOR does, which is what makes the corpus reproducible by a third
      # party rather than merely stable in this repository.
      - name: v1 corpus regenerates byte-identically
        run: |
          bun scripts/synthetic-claims/generate.ts --out /tmp/corpus-v1-check --no-pdf
          diff -rq synthetic-corpus/cases /tmp/corpus-v1-check/cases

      - name: App unit tests
        run: bun test src/lib/

      # Both toolchains are pinned exactly. Javy v9 broke bytecode compatibility
      # with v8, so the compiler version is part of the artifact's identity: a
      # floating version would silently change the published wasm hash. wasmtime
      # is pinned for the same reason — the runtime is part of what "this
      # artifact produces this root" means.
      - name: Install Javy ${{ env.JAVY_VERSION }}
        run: |
          curl -fsSL -o javy.gz \
            "https://github.com/bytecodealliance/javy/releases/download/v${JAVY_VERSION}/javy-x86_64-linux-v${JAVY_VERSION}.gz"
          gunzip javy.gz && chmod +x javy
          ./javy --version

      - name: Install wasmtime ${{ env.WASMTIME_VERSION }}
        run: |
          curl -fsSL -o wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar xf wasmtime.tar.xz
          echo "$PWD/wasmtime-v${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Confirm wasmtime is on PATH
        # The build falls back to node:wasi if wasmtime is missing. That fallback
        # exists for local development; in CI the wasm must be exercised through
        # the runtime a third-party auditor would actually use, so its absence is
        # a failure rather than a quiet substitution.
        run: wasmtime --version

      - name: Build both artifacts and assert they agree
        run: bun run verify:build --require-wasmtime

      - name: Publish artifact manifest
        uses: actions/upload-artifact@v4
        with:
          name: verifier-artifacts
          path: |
            packages/laytime-verify/dist/laygrounded-verify.mjs
            packages/laytime-verify/dist/laygrounded-verify.wasm
            packages/laytime-verify/dist/conformance.json
            packages/laytime-verify/dist/conformance-v2.json
            packages/laytime-verify/dist/manifest.json
