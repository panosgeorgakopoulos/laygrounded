# Browser-level checks: the things a green unit suite cannot see.
#
# Separate from `verifier.yml` because it needs a browser download, a running
# app and live Supabase credentials, and because its failures mean something
# different — a red verifier is "the engine changed", a red E2E is "the product
# does not work in a browser".
name: e2e

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  golden-path:
    runs-on: ubuntu-latest
    # The suite drives a real app against a real database. Without credentials
    # it cannot sign in, and a run that silently "passed" by skipping would be
    # worse than no run — so the job asserts they are present and fails loudly.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # Checks EVERY value the run needs, not just the URL. The earlier version
      # asserted the URL alone, so a missing password sailed through the gate
      # and surfaced six tests later as a 30s `waitForURL` timeout in
      # `beforeEach` — which reads exactly like "claim creation is broken" and
      # is nothing of the sort. A preflight that does not check the credential
      # whose absence actually breaks the run is decoration.
      - name: Require Supabase credentials
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          E2E_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          missing=0
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY E2E_EMAIL E2E_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty. The E2E suite drives a real app against a real"
              echo "::error::database; a run without credentials cannot sign in and must not"
              echo "::error::report success. Set the backing repository secret and re-run."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # Only Chromium, and only its deps. The golden path asserts behaviour, not
      # cross-browser rendering, and three engines would triple the runtime for
      # no additional signal.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Playwright merges `process.env` into the webServer environment before
      # applying `webServer.env`, so everything set here reaches `next dev` too.
      # The suite runs against the dev server, not a production build, so the
      # NEXT_PUBLIC_* values are read at runtime — there is nothing to inline at
      # build time and no separate build step to expose them to.
      #
      # E2E_EMAIL/E2E_PASSWORD are the variable names the suite reads (see
      # tests/e2e/README.md); TEST_USER_EMAIL/TEST_USER_PASSWORD are the secret
      # names in repository settings. The indirection is deliberate — rename the
      # secrets if you want them symmetric, but do not rename only one side.
      - name: Golden path
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          E2E_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: bun run test:e2e

      # Traces and video only exist on failure, and they are the whole reason a
      # remote failure is diagnosable at all.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
